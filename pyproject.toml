[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-manager"
version = "0.5.0"
description = "Professional Python laboratory works, variant 6 (employee accounting)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Anastasiia Zhmurko" }]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
employee-manager = "employee_manager.main:main"
data-processor = "data_processor.main:main"
stream-processor = "stream_processor.main:main"
employee-domain = "employee_domain.main:main"
employee-importer = "employee_importer.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true
