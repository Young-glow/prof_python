[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-manager"
version = "0.6.0"
description = "Professional Python laboratory works, variant 6 (employee accounting)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Anastasiia Zhmurko" }]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
employee-manager = "employee_manager.main:main"
data-processor = "data_processor.main:main"
stream-processor = "stream_processor.main:main"
employee-domain = "employee_domain.main:main"
employee-importer = "employee_importer.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "integration: tests that combine several real components (files, config, pipeline)",
    "slow: tests that take noticeably longer",
]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["employee_domain", "employee_importer"]
omit = ["*/experiments.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_also = ["if __name__ == .__main__.:"]

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true
